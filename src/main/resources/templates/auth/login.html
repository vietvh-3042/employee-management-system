<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body class="flex min-h-screen items-center justify-center bg-slate-950 px-6 py-12">
<main class="w-full max-w-md">
    <div class="mb-8 text-center">
        <p class="text-sm font-semibold uppercase tracking-[0.25em] text-indigo-400">PeopleHub</p>
        <h1 class="mt-3 text-3xl font-bold text-white">Welcome back</h1>
        <p class="mt-2 text-slate-400">Sign in to manage your people and teams.</p>
    </div>
    <form th:action="@{/login}" th:object="${loginRequest}" method="post" class="space-y-5 rounded-2xl bg-white p-8 shadow-2xl">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div th:if="${error}" class="rounded-lg bg-rose-50 px-4 py-3 text-sm text-rose-700" th:text="${error}"></div>
        <div>
            <label for="username" class="mb-2 block text-sm font-medium text-slate-700">Username</label>
            <input id="username" th:field="*{username}" type="text" autocomplete="username" required
                   class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100">
            <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="mt-1 text-sm text-rose-600"></p>
        </div>
        <div>
            <label for="password" class="mb-2 block text-sm font-medium text-slate-700">Password</label>
            <input id="password" th:field="*{password}" type="password" autocomplete="current-password" required
                   class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100">
            <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="mt-1 text-sm text-rose-600"></p>
        </div>
        <button type="submit" class="w-full rounded-lg bg-indigo-600 px-4 py-3 font-semibold text-white transition hover:bg-indigo-700">Sign in</button>
        <p class="text-center text-sm text-slate-500">New here? <a th:href="@{/register}" class="font-semibold text-indigo-600 hover:text-indigo-700">Create an account</a></p>
    </form>
</main>
</body>
</html>
