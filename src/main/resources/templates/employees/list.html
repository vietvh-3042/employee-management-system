<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Employees')}"></head>
<body>
<div th:replace="~{fragments/navigation :: navigation}"></div>
<main class="mx-auto max-w-7xl px-6 py-10">
    <div class="mb-8 flex flex-col justify-between gap-4 sm:flex-row sm:items-end">
        <div><p class="text-sm font-semibold uppercase tracking-wider text-indigo-600">Directory</p><h1 class="mt-2 text-3xl font-bold text-slate-900">Employees</h1><p class="mt-2 text-slate-500">Find the people who make your organization move.</p></div>
        <a th:href="@{/employees/add}" class="rounded-lg bg-indigo-600 px-4 py-2.5 text-center font-semibold text-white hover:bg-indigo-700">Add employee</a>
    </div>
    <form method="get" th:action="@{/employees/list}" class="mb-6 grid gap-3 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm sm:grid-cols-[1fr_1fr_auto]">
        <input name="name" th:value="${name}" placeholder="Search by name" class="rounded-lg border border-slate-300 px-4 py-2.5 outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100">
        <input name="department" th:value="${department}" placeholder="Filter by department" class="rounded-lg border border-slate-300 px-4 py-2.5 outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100">
        <button class="rounded-lg bg-slate-900 px-5 py-2.5 font-semibold text-white hover:bg-slate-700">Search</button>
    </form>
    <section class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
        <table class="min-w-full divide-y divide-slate-200 text-left">
            <thead class="bg-slate-50 text-xs uppercase tracking-wider text-slate-500"><tr><th class="px-6 py-4">Employee</th><th class="px-6 py-4">Email</th><th class="px-6 py-4">Department</th></tr></thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:each="employee : ${employees}" class="hover:bg-slate-50"><td class="px-6 py-4 font-medium text-slate-900" th:text="${employee.name}"></td><td class="px-6 py-4 text-slate-600" th:text="${employee.email}"></td><td class="px-6 py-4 text-slate-600" th:text="${employee.departmentName ?: 'Unassigned'}"></td></tr>
            <tr th:if="${#lists.isEmpty(employees)}"><td colspan="3" class="px-6 py-12 text-center text-slate-500">No employees found.</td></tr>
            </tbody>
        </table>
    </section>
    <nav th:if="${employees.totalPages > 1}" class="mt-6 flex items-center justify-between text-sm">
        <a th:if="${employees.hasPrevious()}"
           th:href="@{/employees/list(page=${employees.number - 1},size=${employees.size},name=${name},department=${department})}"
           class="font-semibold text-indigo-600 hover:text-indigo-700">Previous</a>
        <span th:unless="${employees.hasPrevious()}"></span>
        <span class="text-slate-500">Page <span th:text="${employees.number + 1}"></span> of <span th:text="${employees.totalPages}"></span></span>
        <a th:if="${employees.hasNext()}"
           th:href="@{/employees/list(page=${employees.number + 1},size=${employees.size},name=${name},department=${department})}"
           class="font-semibold text-indigo-600 hover:text-indigo-700">Next</a>
        <span th:unless="${employees.hasNext()}"></span>
    </nav>
</main>
</body>
</html>
