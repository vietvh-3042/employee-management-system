<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Add employee')}"></head>
<body>
<div th:replace="~{fragments/navigation :: navigation}"></div>
<main class="mx-auto max-w-3xl px-6 py-10">
    <a th:href="@{/employees/list}" class="text-sm font-semibold text-indigo-600 hover:text-indigo-700">← Back to employees</a>
    <div class="mb-8 mt-6"><p class="text-sm font-semibold uppercase tracking-wider text-indigo-600">Directory</p><h1 class="mt-2 text-3xl font-bold text-slate-900">Add employee</h1><p class="mt-2 text-slate-500">Create a profile for a new team member.</p></div>
    <form method="post" th:action="@{/employees/add}" th:object="${employeeForm}" class="space-y-6 rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div th:if="${error}" class="rounded-lg bg-rose-50 px-4 py-3 text-sm text-rose-700" th:text="${error}"></div>
        <div><label for="name" class="mb-2 block text-sm font-medium text-slate-700">Full name</label><input id="name" th:field="*{name}" class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100"><p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-1 text-sm text-rose-600"></p></div>
        <div><label for="email" class="mb-2 block text-sm font-medium text-slate-700">Email</label><input id="email" th:field="*{email}" type="email" class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100"><p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="mt-1 text-sm text-rose-600"></p></div>
        <div><label for="departmentId" class="mb-2 block text-sm font-medium text-slate-700">Department</label><select id="departmentId" th:field="*{departmentId}" class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100"><option value="">Unassigned</option><option th:each="department : ${departments}" th:value="${department.id}" th:text="${department.name}"></option></select></div>
        <div class="flex justify-end gap-3"><a th:href="@{/employees/list}" class="rounded-lg px-4 py-3 font-semibold text-slate-600 hover:bg-slate-100">Cancel</a><button type="submit" class="rounded-lg bg-indigo-600 px-5 py-3 font-semibold text-white hover:bg-indigo-700">Save employee</button></div>
    </form>
</main>
</body>
</html>
