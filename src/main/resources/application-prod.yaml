spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
logging:
  level:
    com.learning.employeemanagement: INFO
app:
  security:
    jwt-secret: ${JWT_SECRET}
    cookie-secure: true
    admin:
      username: ${ADMIN_USERNAME:}
      password: ${ADMIN_PASSWORD:}
